<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Nerds | Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <div class="auth-card panel-card">
        <div class="auth-brand">
          <span class="brand-mark">✦</span>
          <span class="brand-name">TECH NERDS</span>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-auth="login">Entrar</button>
          <button class="auth-tab" data-auth="register">Cadastrar</button>
        </div>

        <form id="loginForm" class="auth-form active">
          <label>
            <span>Email</span>
            <input type="email" placeholder="seu@email.com" required />
          </label>
          <label>
            <span>Senha</span>
            <input type="password" placeholder="Sua senha" required />
          </label>
          <button type="submit" class="primary-button full">Acessar conta</button>
        </form>

        <form id="registerForm" class="auth-form">
          <label>
            <span>Nome</span>
            <input type="text" placeholder="Seu nome" required />
          </label>
          <label>
            <span>Email</span>
            <input type="email" placeholder="seu@email.com" required />
          </label>
          <label>
            <span>Senha</span>
            <input type="password" placeholder="Crie uma senha" required />
          </label>
          <button type="submit" class="primary-button full">Criar conta</button>
        </form>

        <a href="index.html" class="small-link">Voltar para o feed</a>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
